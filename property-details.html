<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>تفاصيل العقار | مملكة العقار المباشر DZ</title>

  <meta
    name="description"
    content="اكتشف تفاصيل العقارات المنشورة للبيع والكراء في الجزائر عبر مملكة العقار المباشر."
  >

  <meta name="theme-color" content="#087fa3">

  <link rel="stylesheet" href="style.css?v=4">

  <style>
    .details-page {
      min-height: 70vh;
      padding: 35px 0 65px;
    }

    .details-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary-dark);
      font-weight: 800;
    }

    .details-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 24px;
      align-items: start;
    }

    .details-main,
    .details-sidebar {
      min-width: 0;
    }

    .details-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .details-cover {
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      color: var(--primary-dark);
      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(18,163,200,.15),
          transparent 35%
        ),
        linear-gradient(135deg,#e6f5fa,#fff9eb);
    }

    .details-cover-icon {
      font-size: 66px;
      line-height: 1.4;
    }

    .details-cover p {
      margin: 8px 0 0;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .details-cover img,
    .details-cover video {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      background: #f0f6fa;
    }

    .details-cover.has-media {
      display: block;
      padding: 0;
    }

    .details-body {
      padding: 26px;
    }

    .details-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-bottom: 15px;
    }

    .details-badge {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      background: var(--primary-soft);
      color: var(--primary-dark);
    }

    .details-badge.gold {
      background: #fff6df;
      color: #8a651c;
      border: 1px solid #f0dfb4;
    }

    .details-title {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.6;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .details-location {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 20px;
      color: var(--text-secondary);
      line-height: 1.9;
    }

    .details-price {
      margin: 20px 0;
      padding: 20px;
      background: linear-gradient(135deg,#edf9fd,#fffaf0);
      border: 1px solid #dcebf0;
      border-right: 4px solid var(--gold);
      border-radius: 13px;
    }

    .details-price-label {
      display: block;
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .details-price-value {
      color: var(--primary-dark);
      font-size: clamp(25px, 4vw, 34px);
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .details-specs {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 12px;
      margin: 22px 0;
    }

    .details-spec {
      padding: 15px;
      background: #f7fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      min-width: 0;
    }

    .details-spec-label {
      display: block;
      color: var(--text-secondary);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .details-spec-value {
      display: block;
      color: var(--primary-dark);
      font-size: 15px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .details-section-title {
      margin: 25px 0 12px;
      color: var(--primary-dark);
      font-size: 20px;
      font-weight: 900;
    }

    .details-description {
      color: #425c6a;
      line-height: 2.1;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .sidebar-box {
      padding: 22px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
    }

    .sidebar-box h2 {
      margin: 0 0 12px;
      color: var(--primary-dark);
      font-size: 19px;
    }

    .sidebar-box p {
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 2;
    }

    .contact-privacy {
      padding: 13px;
      margin: 15px 0;
      color: var(--primary-dark);
      background: var(--primary-soft);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.9;
    }

    .trust-list {
      padding: 0;
      margin: 15px 0 0;
      list-style: none;
    }

    .trust-list li {
      padding: 9px 0;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .trust-list li:last-child {
      border-bottom: 0;
    }

    .details-message {
      padding: 24px;
      margin: 20px 0;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text-secondary);
      line-height: 2;
    }

    .details-message h2 {
      color: var(--primary-dark);
    }

    .details-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 18px;
    }

    .details-actions .btn {
      width: 100%;
    }

    @media (max-width: 850px) {
      .details-layout {
        grid-template-columns: 1fr;
      }

      .details-sidebar {
        display: grid;
        grid-template-columns: repeat(2,minmax(0,1fr));
        gap: 14px;
      }

      .sidebar-box {
        margin-bottom: 0;
      }
    }

    @media (max-width: 550px) {
      .details-page {
        padding-top: 22px;
      }

      .details-body {
        padding: 19px 15px;
      }

      .details-cover {
        min-height: 190px;
      }

      .details-cover-icon {
        font-size: 52px;
      }

      .details-specs {
        gap: 9px;
      }

      .details-spec {
        padding: 12px 10px;
      }

      .details-sidebar {
        grid-template-columns: 1fr;
      }

      .details-topbar .btn {
        width: 100%;
      }
    }
  </style>
</head>

    </a>

    <button

              <div class="details-specs">

                <div class="details-spec">
                  <span class="details
