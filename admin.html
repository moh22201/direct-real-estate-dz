<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>لوحة الإدارة | مملكة العقار المباشر DZ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="لوحة مراجعة الإعلانات العقارية.">

  <link rel="stylesheet" href="style.css?v=4">

  <style>
    :root {
      --admin-blue: #07566f;
      --admin-blue-light: #087fa3;
      --admin-gold: #d4ad57;
      --admin-bg: #f2f7f9;
      --admin-text: #193744;
      --admin-muted: #6d818b;
      --admin-border: #dce7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--admin-bg);
      color: var(--admin-text);
      font-family: Arial, Tahoma, sans-serif;
      line-height: 1.7;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .6;
    }

    .admin-header {
      padding: 22px 16px 28px;
      color: #fff;
      background: linear-gradient(125deg, #06485e, #087fa3);
      border-bottom: 4px solid var(--admin-gold);
    }

    .admin-header-inner {
      width: min(1100px, 100%);
      margin: auto;
    }

    .top-links {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
    }

    .top-links a {
      color: #fff;
      font-size: 14px;
      text-decoration: none;
    }

    .top-links a:hover {
      color: #ffe6a7;
    }

    .admin-header h1 {
      margin: 0 0 5px;
      font-size: clamp(24px, 5vw, 34px);
    }

    .admin-header p {
      margin: 0;
      color: #e3f5fa;
      font-size: 14px;
    }

    .admin-container {
      width: min(1100px, calc(100% - 24px));
      margin: 24px auto 45px;
    }

    .notice {
      padding: 14px 16px;
      margin-bottom: 18px;
      border: 1px solid var(--admin-border);
      border-radius: 12px;
      background: #fff;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: #8a2828;
      background: #fff0f0;
      border-color: #efc3c3;
    }

    .notice.warning {
      color: #745719;
      background: #fff9e9;
      border-color: #ead8a7;
    }

    .notice.success {
      color: #205c31;
      background: #edf9f0;
      border-color: #bce4c6;
    }

    .notice a {
      color: inherit;
      font-weight: 700;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar input {
      flex: 1 1 230px;
      min-width: 0;
      min-height: 46px;
      padding: 10px 13px;
      border: 1px solid #cfdee4;
      border-radius: 10px;
      background: #fff;
      color: var(--admin-text);
      outline: none;
    }

    .toolbar input:focus {
      border-color: var(--admin-blue-light);
      box-shadow: 0 0 0 3px rgba(8, 127, 163, .1);
    }

    .button {
      min-height: 44px;
      padding: 9px 15px;
      border: 0;
      border-radius: 9px;
      font-weight: 700;
    }

    .button-primary {
      color: #fff;
      background: var(--admin-blue);
    }

    .button-primary:hover {
      background: var(--admin-blue-light);
    }

    .button-approve {
      color: #fff;
      background: #247344;
    }

    .button-reject {
      color: #fff;
      background: #a52f37;
    }

    .button-neutral {
      color: var(--admin-blue);
      background: #e9f4f7;
      border: 1px solid #cfe4eb;
    }

    .results-count {
      margin: 0 0 14px;
      color: var(--admin-muted);
      font-size: 14px;
    }

    .property-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .property-card {
      min-width: 0;
      padding: 19px;
      background: #fff;
      border: 1px solid var(--admin-border);
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(10, 68, 87, .045);
    }

    .property-card h2 {
      margin: 0 0 8px;
      color: var(--admin-blue);
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .property-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .tag {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 7px;
      color: #07566f;
      background: #eaf5f8;
      font-size: 12px;
    }

    .property-description {
      margin: 12px 0;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .property-details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid #edf1f3;
      font-size: 13px;
    }

    .detail-label {
      display: block;
      color: var(--admin-muted);
      font-size: 12px;
    }

    .property-id {
      margin-top: 12px;
      color: var(--admin-muted);
      font-size: 11px;
      overflow-wrap: anywhere;
      direction: ltr;
      text-align: right;
    }

    .property-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 16px;
    }

    .property-actions .button {
      flex: 1 1 120px;
    }

    .empty-state {
      padding: 35px 18px;
      text-align: center;
      background: #fff;
      border: 1px dashed #cbdde4;
      border-radius: 14px;
      color: var(--admin-muted);
    }

    .empty-state strong {
      display: block;
      margin-bottom: 6px;
      color: var(--admin-blue);
      font-size: 18px;
    }

    .admin-footer {
      padding: 20px 12px;
      color: var(--admin-muted);
      text-align: center;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 700px) {
      .property-list {
        grid-template-columns: 1fr;
      }

      .admin-container {
        width: calc(100% - 20px);
        margin-top: 16px;
      }

      .property-card {
        padding: 15px;
      }

      .toolbar > * {
        width: 100%;
      }

      .property-actions .button {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>

  <header class="admin-header">
    <div class="admin-header-inner">

      <nav class="top-links" aria-label="التنقل">
        <a href="index.html">← الصفحة الرئيسية</a>
        <a href="add-property.html">إضافة إعلان</a>
      </nav>

      <h1>لوحة إدارة مملكة العقار المباشر DZ</h1>

      <p>
        مراجعة الإعلانات قبل نشرها على الموقع.
      </p>

    </div>
  </header>

  <main class="admin-container">

    <div id="pageMessage" class="notice" role="status" aria-live="polite">
      جارٍ التحقق من صلاحيات المسؤول...
    </div>

    <section id="adminPanel" hidden>

      <div class="toolbar">

        <input
          id="searchInput"
          type="search"
          placeholder="ابحث بالعنوان أو الولاية أو البلدية..."
          aria-label="البحث في الإعلانات"
        >

        <button
          type="button"
          id="refreshButton"
          class="button button-primary"
        >
          تحديث القائمة
        </button>

      </div>

      <p id="resultsCount" class="results-count"></p>

      <div id="propertyList" class="property-list"></div>

      <div id="emptyState" class="empty-state" hidden>
        <strong>لا توجد إعلانات تنتظر المراجعة</strong>
        ستظهر هنا الإعلانات الجديدة التي تحتاج إلى قرار إداري.
      </div>

    </section>

  </main>

  <footer class="admin-footer">
    مملكة العقار المباشر DZ — لوحة الإدارة
  </footer>

  <script>
    "use strict";

    (() => {
      const SUPABASE_URL =
        "https://fppzejxdggnlscjcqmgk.supabase.co";

      const SUPABASE_KEY =
        "sb_publishable_qhAVIMpyEcE_Y_7L_9irrQ_Naru1RBC";

      const pageMessage = document.getElementById("pageMessage");
      const adminPanel = document.getElementById("adminPanel");
      const propertyList = document.getElementById("propertyList");
      const emptyState = document.getElementById("emptyState");
      const resultsCount = document.getElementById("resultsCount");
      const searchInput = document.getElementById("searchInput");
      const refreshButton = document.getElementById("refreshButton");

      let session = null;
      let properties = [];
      let busy = false;

      const CATEGORY_LABELS = {
        apartment: "شقة",
        house: "منزل",
        land: "أرض للبناء",
        farm: "أرض فلاحية",
        commercial: "عقار تجاري"
      };

      const OPERATION_LABELS = {
        sale: "للبيع",
        rent: "للكراء"
      };

      function showMessage(message, type = "") {
        pageMessage.className = "notice" + (type ? " " + type : "");
        pageMessage.textContent = message;
        pageMessage.hidden = false;
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]);
      }

      function getSession() {
        try {
          const raw = localStorage.getItem("supabaseSession");

          if (!raw) return null;

          const saved = JSON.parse(raw);

          if (
            !saved ||
            !saved.access_token ||
            !saved.user ||
            !saved.user.id
          ) {
            return null;
          }

          if (
            saved.expires_at &&
            Number(saved.expires_at) <
              Math.floor(Date.now() / 1000) + 30
          ) {
            return null;
          }

          return saved;
        } catch {
          return null;
        }
      }

      function getHeaders(extra = {}) {
        return {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + session.access_token,
          ...extra
        };
      }

      async function request(path, options = {}) {
        const response = await fetch(
          SUPABASE_URL + path,
          {
            ...options,
            headers: getHeaders(options.headers || {})
          }
        );

        const text = await response.text();
        let data = null;

        if (text) {
          try {
            data = JSON.parse(text);
          } catch {
            data = text;
          }
        }

        if (!response.ok) {
          const message =
            data && typeof data === "object"
              ? (
                  data.message ||
                  data.error_description ||
                  data.error ||
                  "تعذر إكمال الطلب."
                )
              : "تعذر إكمال الطلب.";

          const error = new Error(message);
          error.status = response.status;
          throw error;
        }

        return data;
      }

      async function verifyAdmin() {
        session = getSession();

        if (!session) {
          showMessage(
            "يجب تسجيل الدخول أولًا. سيتم توجيهك إلى صفحة الدخول.",
            "warning"
          );

          window.setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);

          return false;
        }

        const params = new URLSearchParams({
          select: "user_id",
          user_id: "eq." + session.user.id,
          limit: "1"
        });

        try {
          const rows = await request(
            "/rest/v1/admin_users?" + params.toString()
          );

          if (!Array.isArray(rows) || rows.length === 0) {
            showMessage(
              "هذا الحساب غير مسجل ضمن المسؤولين. لا يمكن فتح لوحة الإدارة.",
              "error"
            );

            return false;
          }

          return true;
        } catch (error) {
          if (error.status === 401) {
            showMessage(
              "انتهت جلسة الدخول أو لم تعد صالحة. سجّل الدخول من جديد.",
              "warning"
            );

            window.setTimeout(() => {
              window.location.href = "login.html";
            }, 1500);

            return false;
          }

          showMessage(
            "تعذر التحقق من صلاحيات المسؤول. تحقق من تسجيل الدخول وإعدادات Supabase. " +
            error.message,
            "error"
          );

          return false;
        }
      }

      function formatPrice(value) {
        const price = Number(value);

        if (!Number.isFinite(price)) {
          return "غير محدد";
        }

        return new Intl.NumberFormat("ar-DZ", {
          maximumFractionDigits: 2
        }).format(price) + " دج";
      }

      function formatDate(value) {
        if (!value) return "غير متوفر";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return "غير متوفر";
        }

        return new Intl.DateTimeFormat("ar-DZ", {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(date);
      }

      function getSearchText(property) {
        return [
          property.title,
          property.wilaya,
          property.commune,
          property.description,
          CATEGORY_LABELS[property.category] || property.category,
          OPERATION_LABELS[property.operation] || property.operation
        ].join(" ").toLocaleLowerCase("ar");
      }

      function createCard(property) {
        const card = document.createElement("article");
        card.className = "property-card";

        const description = property.description
          ? escapeHTML(property.description)
          : "لم يضف صاحب الإعلان وصفًا.";

        const category =
          CATEGORY_LABELS[property.category] || property.category || "غير محدد";

        const operation =
          OPERATION_LABELS[property.operation] || property.operation || "غير محدد";

        const area =
          property.area_m2 == null
            ? "غير محددة"
            : escapeHTML(property.area_m2) + " م²";

        const bedrooms =
          property.bedrooms == null
            ? "غير محدد"
            : escapeHTML(property.bedrooms);

        const bathrooms =
          property.bathrooms == null
            ? "غير محدد"
            : escapeHTML(property.bathrooms);

        const detailsURL =
          "property-details.html?id=" +
          encodeURIComponent(property.id);

        card.innerHTML = `
          <h2>${escapeHTML(property.title || "إعلان بلا عنوان")}</h2>

          <div class="property-meta">
            <span class="tag">${escapeHTML(category)}</span>
            <span class="tag">${escapeHTML(operation)}</span>
            <span class="tag">بانتظار المراجعة</span>
          </div>

          <div class="property-description">${description}</div>

          <div class="property-details">
            <div>
              <span class="detail-label">الولاية</span>
              ${escapeHTML(property.wilaya || "غير محددة")}
            </div>

            <div>
              <span class="detail-label">البلدية</span>
              ${escapeHTML(property.commune || "غير محددة")}
            </div>

            <div>
              <span class="detail-label">السعر</span>
              ${escapeHTML(formatPrice(property.price))}
            </div>

            <div>
              <span class="detail-label">المساحة</span>
              ${area}
            </div>

            <div>
              <span class="detail-label">غرف النوم</span>
              ${bedrooms}
            </div>

            <div>
              <span class="detail-label">الحمامات</span>
              ${bathrooms}
            </div>

            <div>
              <span class="detail-label">تاريخ الإضافة</span>
              ${escapeHTML(formatDate(property.created_at))}
            </div>
          </div>

          <div class="property-id">
            ID: ${escapeHTML(property.id)}
          </div>

          <div class="property-actions">
            <button
              type="button"
              class="button button-approve"
              data-action="approve"
              data-id="${escapeHTML(property.id)}"
            >الموافقة والنشر</button>

            <button
              type="button"
              class="button button-reject"
              data-action="reject"
              data-id="${escapeHTML(property.id)}"
            >رفض الإعلان</button>

            <a
              class="button button-neutral"
              href="${detailsURL}"
              target="_blank"
              rel="noopener noreferrer"
              style="text-align:center;text-decoration:none"
            >فتح تفاصيل الإعلان</a>
          </div>
        `;

        return card;
      }

      function renderProperties() {
        const query = searchInput.value.trim().toLocaleLowerCase("ar");

        const filtered = properties.filter(property => {
          return getSearchText(property).includes(query);
        });

        propertyList.replaceChildren();

        for (const property of filtered) {
          propertyList.appendChild(createCard(property));
        }

        resultsCount.textContent =
          "الإعلانات المعروضة: " + filtered.length +
          " من أصل " + properties.length + " إعلان بانتظار المراجعة.";

        emptyState.hidden = filtered.length > 0;
        propertyList.hidden = filtered.length === 0;
      }

      async function loadProperties() {
        if (busy) return;

        busy = true;
        refreshButton.disabled = true;
        refreshButton.textContent = "جارٍ التحديث...";

        showMessage("جارٍ تحميل الإعلانات التي تنتظر المراجعة...");

        const params = new URLSearchParams({
          select: [
            "id",
            "title",
            "description",
            "category",
            "operation",
            "wilaya",
            "commune",
            "price",
            "area_m2",
            "bedrooms",
            "bathrooms",
            "created_at",
            "status"
          ].join(","),
          status: "eq.pending_review",
          order: "created_at.desc",
          limit: "100"
        });

        try {
          const rows = await request(
            "/rest/v1/properties?" + params.toString()
          );

          properties = Array.isArray(rows) ? rows : [];

          renderProperties();

          showMessage(
            properties.length
              ? "تم تحميل الإعلانات بنجاح. راجع تفاصيل كل إعلان قبل اتخاذ القرار."
              : "لا توجد حاليًا إعلانات تنتظر المراجعة.",
            "success"
          );
        } catch (error) {
          showMessage(
            "تعذر تحميل الإعلانات: " + error.message,
            "error"
          );
        } finally {
          busy = false;
          refreshButton.disabled = false;
          refreshButton.textContent = "تحديث القائمة";
        }
      }

      async function updatePropertyStatus(id, newStatus) {
        if (busy) return;

        const property = properties.find(item => item.id === id);

        if (!property || property.status !== "pending_review") {
          showMessage(
            "لم يعد هذا الإعلان ضمن قائمة الانتظار. حدّث القائمة أولًا.",
            "warning"
          );
          return;
        }

        const isApprove = newStatus === "published";

        const confirmation = isApprove
          ? "هل راجعت الإعلان وتؤكد الموافقة على نشره؟"
          : "هل تؤكد رفض هذا الإعلان؟ سيبقى محفوظًا في قاعدة البيانات بحالة مرفوض.";

        if (!window.confirm(confirmation)) {
          return;
        }

        busy = true;

        const buttons = propertyList.querySelectorAll(
          'button[data-id="' + CSS.escape(id) + '"]'
        );

        buttons.forEach(button => {
          button.disabled = true;
        });

        showMessage(
          isApprove
            ? "جارٍ نشر الإعلان..."
            : "جارٍ تحديث حالة الإعلان...",
          "warning"
        );

        try {
          const params = new URLSearchParams({
            id: "eq." + id,
            status: "eq.pending_review",
            select: "id,status"
          });

          const result = await request(
            "/rest/v1/properties?" + params.toString(),
            {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                "Prefer": "return=representation"
              },
              body: JSON.stringify({
                status: newStatus
              })
            }
          );

          if (!Array.isArray(result) || result.length === 0) {
            showMessage(
              "لم يتغير الإعلان. ربما عالجه مسؤول آخر أو لا تسمح سياسات قاعدة البيانات بهذا التعديل. حدّث القائمة.",
              "warning"
            );

            return;
          }

          properties = properties.filter(item => item.id !== id);
          renderProperties();

          showMessage(
            isApprove
              ? "تمت الموافقة على الإعلان ونشره بنجاح."
              : "تم رفض الإعلان. بقي محفوظًا في قاعدة البيانات.",
            "success"
          );
        } catch (error) {
          showMessage(
            "تعذر تحديث الإعلان: " + error.message,
            "error"
          );
        } finally {
          busy = false;
          await loadProperties();
        }
      }

      propertyList.addEventListener("click", async event => {
        const button = event.target.closest("button[data-action]");

        if (!button) return;

        const id = button.dataset.id;
        const action = button.dataset.action;

        if (action === "approve") {
          await updatePropertyStatus(id, "published");
        } else if (action === "reject") {
          await updatePropertyStatus(id, "rejected");
        }
      });

      searchInput.addEventListener("input", renderProperties);

      refreshButton.addEventListener("click", loadProperties);

      async function initialize() {
        const allowed = await verifyAdmin();

        if (!allowed) {
          adminPanel.hidden = true;
          return;
        }

        adminPanel.hidden = false;
        await loadProperties();
      }

      initialize();
    })();
  </script>

</body>
</html>
